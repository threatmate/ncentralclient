name: CICD Build
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: 0
      GOPRIVATE: github.com/threatmate/*
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: |
          git fetch --tags --force  # Retrieve annotated tags.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Setup Golang module caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golang-module-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golang-module-
      - name: Setup Golang install caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin
          key: ${{ runner.os }}-golang-install-${{ hashFiles('go.install') }}
          restore-keys: |
            ${{ runner.os }}-golang-install-
      - name: List the threatmate modules this repo needs
        # The read token below is scoped to exactly these repositories, so a
        # job (including one on a Dependabot PR) can read nothing else. go.sum is
        # read too: it also names modules reached only through a dependency's
        # tests, which `go mod tidy` resolves. A module missing from the App's
        # installation fails the next step.
        id: modules
        run: |
          repos=$(git ls-files -z -- '*go.mod' '*go.sum' | xargs -0 cat \
            | grep -oE 'github\.com/threatmate/[A-Za-z0-9_.-]+' \
            | sed 's#^github\.com/threatmate/##' | sort -u \
            | grep -vxF "${GITHUB_REPOSITORY#*/}" | paste -sd, -) || true
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
      - name: Mint a read-only token for those modules
        id: app-token
        if: steps.modules.outputs.repos != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: threatmate
          repositories: ${{ steps.modules.outputs.repos }}
          permission-contents: read
      - name: Setup access token
        if: steps.modules.outputs.repos != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/threatmate/".insteadOf "https://github.com/threatmate/"
      - name: Build prep
        run: make clean
      - name: Build
        run: make cicd-build

